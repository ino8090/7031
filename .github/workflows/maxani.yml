name: max animasyon

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  yayin:

    runs-on: ubuntu-latest

    timeout-minutes: 360

    steps:

      # =====================================================
      # REPOSITORY
      # =====================================================

      - name: 📥 Depoyu klonla
        uses: actions/checkout@v4


      # =====================================================
      # PYTHON
      # =====================================================

      - name: 🐍 Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # =====================================================
      # FFMPEG
      # =====================================================

      - name: 📦 FFmpeg ve Kurulumlar
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            --no-install-recommends \
            ffmpeg \
            ca-certificates \
            openssl \
            curl

          python -m pip install --upgrade pip

          pip install requests


      # =====================================================
      # GIST TEST
      # =====================================================

      - name: 🔐 Gist bağlantı testi
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

        run: |

          echo "=========================================="
          echo "🔐 GITHUB GIST TOKEN TESTİ"
          echo "=========================================="

          if [ -z "$GH_TOKEN" ]; then

            echo "❌ GH_TOKEN BOŞ!"
            echo ""
            echo "GitHub Repository → Settings →"
            echo "Secrets and variables → Actions"
            echo ""
            echo "GH_TOKEN isimli secret oluşturulmalı."

            exit 1

          fi

          echo "✅ GH_TOKEN Actions'a aktarılmış."
          echo "🔢 Token uzunluğu: ${#GH_TOKEN}"

          echo ""
          echo "🔎 Gist kontrol ediliyor..."

          HTTP_CODE=$(curl -s \
            -o /tmp/gist_response.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: MaxAnimasyon-Gist-Bot" \
            "https://api.github.com/gists/34df90330e4b0daeed9a5b516c1c368d")

          echo ""
          echo "📡 Gist API HTTP sonucu: $HTTP_CODE"
          echo ""

          if [ "$HTTP_CODE" = "200" ]; then

            echo "✅ Gist okunabiliyor."
            echo "✅ Token geçerli."
            echo "✅ Gist erişimi mevcut."

          elif [ "$HTTP_CODE" = "401" ]; then

            echo "❌ HTTP 401"
            echo "❌ Token geçersiz veya yanlış."
            echo ""

            cat /tmp/gist_response.json

            exit 1

          elif [ "$HTTP_CODE" = "403" ]; then

            echo "❌ HTTP 403"
            echo "❌ Gist erişim yetkisi reddedildi."
            echo ""

            cat /tmp/gist_response.json

            exit 1

          elif [ "$HTTP_CODE" = "404" ]; then

            echo "❌ HTTP 404"
            echo "❌ Gist bulunamadı."
            echo ""

            cat /tmp/gist_response.json

            exit 1

          else

            echo "❌ Beklenmeyen HTTP: $HTTP_CODE"
            echo ""

            cat /tmp/gist_response.json

            exit 1

          fi


      # =====================================================
      # YAYIN
      # =====================================================

      - name: 🚀 Yayını başlat
        env:

          # GitHub Gist token
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

          # Gist state dosyası
          STATE_FILE_NAME: "state_animasyon.json"

          # RTMP yayın anahtarı
          STREAM_KEY: ${{ secrets.STREAM_KEY }}

        run: |

          echo "=========================================="
          echo "📺 MAX ANİMASYON YAYINI BAŞLIYOR"
          echo "=========================================="

          echo ""
          echo "🐍 Python:"
          python --version

          echo ""
          echo "🎬 FFmpeg:"
          ffmpeg -version | head -n 1

          echo ""

          if [ -n "$GH_TOKEN" ]; then

            echo "🔐 GH_TOKEN: ✅ Mevcut"

          else

            echo "🔐 GH_TOKEN: ❌ Yok"

            exit 1

          fi

          echo ""
          echo "🚀 maxani.py çalıştırılıyor..."
          echo ""

          python -u maxani.py
